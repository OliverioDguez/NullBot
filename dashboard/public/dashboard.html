<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NullBot Server Dashboard. Configure your Discord Server securely, manage warnings, and setup auto-replies." />
    <meta name="robots" content="noindex, nofollow" /> <!-- Dashboards shouldn't be indexed since they require login -->
    <title>NullBot — Dashboard</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>🛡️ NullBot</h2>
        <select id="guild-selector" aria-label="Select server"></select>
      </div>
      <nav>
        <ul>
          <li>
            <a href="#" data-page="overview" class="nav-link active"
              >📊 Overview</a
            >
          </li>
          <li>
            <a href="#" data-page="config" class="nav-link">⚙️ Configuration</a>
          </li>
          <li>
            <a href="#" data-page="warnings" class="nav-link">⚠️ Warnings</a>
          </li>
          <li>
            <a href="#" data-page="leaderboard" class="nav-link"
              >🏆 Leaderboard</a
            >
          </li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info" id="user-info"></div>
        <div class="footer-actions">
          <a
            href="/auth/invite"
            target="_blank"
            rel="noopener noreferrer"
            class="sidebar-btn invite"
            >➕ Invite Bot</a
          >
          <a href="/auth/logout" class="sidebar-btn logout">Logout</a>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">
      <!-- Overview Page -->
      <section id="page-overview" class="page active">
        <h2>Server Overview</h2>
        <div class="stats-grid" id="overview-stats"></div>
        <article>
          <header>🏆 Top 5 Members</header>
          <div id="overview-leaderboard"></div>
        </article>
      </section>

      <!-- Configuration Page -->
      <section id="page-config" class="page">
        <h2>Configuration</h2>
        <article>
          <header>📢 Channel Settings</header>
          <div class="grid">
            <label
              >Welcome Channel
              <select id="cfg-welcome"></select>
            </label>
            <label
              >Mod Log Channel
              <select id="cfg-log"></select>
            </label>
            <label
              >Level-Up Channel
              <select id="cfg-levelup"></select>
            </label>
          </div>
        </article>

        <article>
          <header>🚫 Banned Words</header>
          <div class="inline-form">
            <input
              type="text"
              id="banned-word-input"
              placeholder="Add a word..."
            />
            <button id="add-banned-word">Add</button>
          </div>
          <div id="banned-words-list" class="tag-list"></div>
        </article>

        <article>
          <header>💬 Auto-Replies</header>
          <div class="inline-form">
            <input
              type="text"
              id="autoreply-trigger"
              placeholder="Trigger..."
            />
            <input
              type="text"
              id="autoreply-response"
              placeholder="Response..."
            />
            <button id="add-autoreply">Add</button>
          </div>
          <div id="auto-replies-list"></div>
        </article>
      </section>

      <!-- Warnings Page -->
      <section id="page-warnings" class="page">
        <h2>Warnings</h2>
        <input
          type="search"
          id="warning-search"
          placeholder="Search by username..."
        />
        <article>
          <div id="warnings-list"></div>
        </article>
      </section>

      <!-- Leaderboard Page -->
      <section id="page-leaderboard" class="page">
        <h2>Leaderboard</h2>
        <article>
          <div id="leaderboard-table"></div>
        </article>
      </section>
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
  </body>
</html>
